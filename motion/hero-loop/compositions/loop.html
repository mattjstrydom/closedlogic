  <script>
      const tl = gsap.timeline({ paused: true });
      const SIDE = 14; // half of a dot, to centre it on a point
      const E = "power2.inOut";

      // Opening frame = closing frame: the idle chain, no dots, no pills, no chip, grey links.
      gsap.set(["#l1f", "#l2bad", "#l2good"], { opacity: 0 });
      gsap.set("#l1f", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#l2good", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#gap", { opacity: 0 });
      gsap.set(["#d1", "#d2", "#d3"], { opacity: 0, x: 352 - SIDE });
      gsap.set(["#p1", "#p2bad", "#p2good"], { opacity: 0, xPercent: -50 });
      gsap.set("#chip", { opacity: 0, xPercent: -50, y: 0 });

      const flash = (id, at, col) => {
        tl.fromTo(id, { borderColor: "#e7e8ec" }, { borderColor: col, duration: 0.4, ease: "sine.inOut" }, at);
        tl.to(id, { borderColor: "#e7e8ec", duration: 0.4, ease: "sine.inOut" }, at + 0.4);
      };

      // 0.0 to 1.5: a calm pass of attention across the three nodes
      flash("#n1", 0.1, "#868c98");
      flash("#n2", 0.4, "#868c98");
      flash("#n3", 0.7, "#868c98");

      // 1.5 to 3.5: a lead leaves the form and reaches the CRM; first link is healthy
      tl.fromTo("#d1", { opacity: 0, x: 352 - SIDE }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.5);
      tl.to("#d1", { x: 560 - SIDE, duration: 1.4, ease: E }, 1.7);
      tl.to("#l1f", { opacity: 1, duration: 0.01 }, 1.7);
      tl.to("#l1f", { scaleX: 1, duration: 1.2, ease: E }, 1.7);
      tl.to("#d1", { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.9);
      tl.fromTo("#p1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.9);
      tl.fromTo("#n2", { borderColor: "#e7e8ec" }, { borderColor: "#0e7490", duration: 0.35, ease: "sine.inOut", immediateRender: false }, 2.9);
      tl.to("#n2", { borderColor: "#e7e8ec", duration: 0.4, ease: "sine.inOut" }, 3.25);

      // 3.5 to 5.0: the next lead tries to reach the ad platform and stops halfway; the link turns red
      tl.fromTo("#d2", { opacity: 0, x: 772 - SIDE }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 3.5);
      tl.to("#d2", { x: 850 - SIDE, duration: 0.9, ease: "power2.out" }, 3.6);
      tl.to("#l2bad", { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.5);
      tl.to("#gap", { opacity: 1, duration: 0.2 }, 4.5);
      tl.to("#d2", { opacity: 0.35, duration: 0.4 }, 4.5);
      tl.fromTo("#p2bad", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.65);

      // 5.0 to 6.5: the change-log chip slides in near the broken link
      tl.fromTo("#chip", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.0);

      // 6.5 to 8.5: the link turns healthy and a new lead travels the whole chain
      tl.to("#l2bad", { opacity: 0, duration: 0.4, ease: "power1.inOut" }, 6.5);
      tl.to("#gap", { opacity: 0, duration: 0.3 }, 6.5);
      tl.to("#d2", { opacity: 0, duration: 0.2 }, 6.5);
      tl.to("#l2good", { opacity: 1, duration: 0.01 }, 6.5);
      tl.to("#l2good", { scaleX: 1, duration: 0.5, ease: E }, 6.5);
      tl.to("#p2bad", { opacity: 0, duration: 0.3 }, 6.8);
      tl.fromTo("#p2good", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.9);
      tl.to("#chip", { opacity: 0, y: -6, duration: 0.5, ease: "power1.in" }, 7.5);
      tl.fromTo("#d3", { opacity: 0, x: 352 - SIDE }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 6.7);
      tl.to("#d3", { x: 1060 - SIDE, duration: 1.6, ease: "sine.inOut" }, 6.8);
      tl.to("#d3", { opacity: 0, duration: 0.25, ease: "power1.in" }, 8.25);
      tl.fromTo("#n3", { borderColor: "#e7e8ec" }, { borderColor: "#0e7490", duration: 0.3, ease: "sine.inOut", immediateRender: false }, 8.2);

      // 8.5 to 10.0: hold, then ease back to the opening frame
      tl.to("#n3", { borderColor: "#e7e8ec", duration: 0.4, ease: "sine.inOut" }, 8.7);
      tl.to(["#l1f", "#l2good"], { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 8.9);
      tl.to(["#p1", "#p2good"], { opacity: 0, duration: 0.8, ease: "power1.inOut" }, 8.9);
      tl.to({}, { duration: 0.01 }, 9.99); // pad the timeline to exactly 10 s

      window.__timelines = window.__timelines || {};
      window.__timelines["loop"] = tl;
      tl.seek(0);
      </script>
