<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #ffffff; }
    </style>
  </head>
  <body>
    <!-- The canvas is 1280 x 720: the card on the page shows it at 640 x 360, so this is a 2x render. -->
    <div id="main" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="720">
      <div
        id="loop"
        class="clip"
        data-composition-id="loop"
        data-composition-src="compositions/loop.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1280"
        data-height="720"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
