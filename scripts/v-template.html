<!doctype html>
<!--
  Template for a new unlisted /v/ video page (Closed Logic). Not deployed: it lives in scripts/, not public/.

  To make a page:
  1. Copy this file to public/v/<slug>.html. The slug is "<company>-<8 random lowercase letters/digits>", e.g.
     capsa-wg8wcdsg. Put the video and its first-frame poster next to it as public/v/<slug>-<version>.mp4 and .webp
     (1280x720; poster as webp).
  2. Replace every {{TOKEN}}:
       {{SLUG}}         page slug (also used as the Cal.com utm_campaign and the Clarity v_page tag)
       {{VERSION}}      video version, e.g. v9
       {{CARD_TITLE}}   the exact headline on the video's opening card, e.g. A question about Capsa&#8217;s website tracking
       {{CARD_TITLE_LOWERCASE_FIRST}}  the same with a lowercase first letter, e.g. a question about Capsa&#8217;s ...
       {{FIRST_NAME}} {{LAST_NAME}}   the contact
     Use &#8217; for apostrophes. grep for "{{" before committing; none may remain.
  3. Keep: noindex meta, the "AI voiceover" label, /v/clarity.js and /v/cta.js, and the Book button with
     data-cta="book". scripts/cf-postbuild.mjs adds clarity.js/cta.js if missing and warns when a page has no Book
     button or its utm_campaign does not match the slug.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{{CARD_TITLE}} | Closed Logic</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/v/clarity.js" async></script>
<script src="/v/cta.js" defer></script>
<link rel="preload" href="/v/poppins-semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Poppins;font-weight:400;font-style:normal;font-display:swap;src:url(/v/poppins-regular.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;font-style:normal;font-display:swap;src:url(/v/poppins-semibold.woff2) format("woff2")}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#0a0a0a;font-family:Poppins,Arial,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 40px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:1.3rem;letter-spacing:-0.03em;line-height:1}
.logo svg{width:32px;height:32px}
a.logo{color:inherit;text-decoration:none;border-radius:6px}
a.logo:focus-visible{outline:3px solid #ff4b3e;outline-offset:4px}
h1{font-weight:600;font-size:clamp(1.5rem,4.2vw,2.4rem);line-height:1.2;letter-spacing:-0.02em;margin:40px 0 24px;border-left:5px solid #ff4b3e;padding-left:16px}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0a0a0a;border-radius:8px}
.vo{font-size:0.8rem;color:#6b6b6b;margin:8px 0 0}
.note{font-size:1.05rem;margin:20px 0 0}
.cta{margin:24px 0 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;padding:12px 28px;background:#ff4b3e;color:#0a0a0a;font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:1.05rem;line-height:1.2;text-decoration:none;border-radius:8px}
.btn:hover{background:#ff6a5f}
.btn:focus-visible{outline:3px solid #0a0a0a;outline-offset:3px}
.cta .note{margin-top:12px}
@media (min-width:640px){.btn{display:inline-flex;width:auto}}
footer{border-top:1px solid #e5e5e5;margin-top:48px;padding-top:16px;font-size:.85rem;color:#444}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="logo" href="https://www.closedlogic.com/" aria-label="Closed Logic home"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="22" fill="none" stroke="#0a0a0a" stroke-width="9" stroke-dasharray="104 34" stroke-dashoffset="-10" transform="rotate(-20 32 32)"/><circle cx="53" cy="32" r="7" fill="#ff4b3e" stroke="#0a0a0a" stroke-width="3"/></svg><span><b style="font-weight:600">Closed</b> Logic</span></a>
</header>
<main>
<h1>{{FIRST_NAME}}, {{CARD_TITLE_LOWERCASE_FIRST}}</h1>
<video controls playsinline preload="metadata" poster="/v/{{SLUG}}-{{VERSION}}.webp" width="1280" height="720">
<source src="/v/{{SLUG}}-{{VERSION}}.mp4" type="video/mp4">
</video>
<p class="vo">AI voiceover</p>
<div class="cta">
<a class="btn" data-cta="book" data-v-slug="{{SLUG}}" href="https://cal.com/closedlogic/20min-fit?utm_source=video-page&amp;utm_campaign={{SLUG}}" target="_blank" rel="noopener">Book a 20-minute call</a>
<p class="note">Reply to the email or message if you&#8217;d like a hand getting it fixed.</p>
</div>
<!-- Optional: one short body paragraph, <p class="note">{{BODY}}</p>, goes here. Delete this comment if unused. -->
</main>
<footer>Closed Logic is a trading name of Reubika LLC, 530-B Harkle Road, STE 100, Santa Fe, NM 87505.</footer>
</div>
</body>
</html>
