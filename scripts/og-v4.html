<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closed Logic share image</title>
<!-- Rendered to public/closedlogic-og-v3-1200x630.png and -x-1200x600.png by scripts/make-og.mjs.
     "Bright and crisp" system: white, Inter (the site's self-hosted file), brand red only on the logo dot and the glow.
     Content is the wordmark and the headline only; keep the alt text in app/seo.ts in step with it. -->
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal; src: url("../app/fonts/inter-latin-var.woff2") format("woff2"); }
  :root { --fg:#0b0b0c; --brand:#ff4b3e; --glow:#ffe3df; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; background: #fff; font-family: "Inter", Arial, sans-serif; font-optical-sizing: auto; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .frame {
    width: 1200px; height: var(--h, 630px); padding: 56px 72px; display: grid; align-items: center; position: relative; overflow: hidden;
    background: radial-gradient(760px 380px at 78% 78%, var(--glow), transparent 70%), #fff;
  }
  .brand { position: absolute; left: 72px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .brand svg { width: 40px; height: 40px; }
  .brand b { font-weight: 700; } .brand span { font-weight: 400; }
  h1 { font-weight: 600; font-size: 88px; line-height: 1.04; letter-spacing: -0.035em; margin-top: 44px; max-width: 1040px; text-wrap: balance; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#0b0b0c" stroke-width="9" stroke-dasharray="104 34" stroke-dashoffset="-10" transform="rotate(-20 32 32)"/><circle cx="53" cy="32" r="7" fill="#ff4b3e" stroke="#0b0b0c" stroke-width="3"/></svg>
    <div><b>Closed</b> <span>Logic</span></div>
  </div>
  <h1>Marketing ops when you need it, without hiring for it.</h1>
</div>
</body>
</html>
