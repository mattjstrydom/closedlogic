<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closed Logic share image</title>
<!-- Rendered to public/closedlogic-og-v3-1200x630.png and -x-1200x600.png by scripts/make-og.mjs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500&family=Poppins:wght@400;600;700&display=swap">
<style>
  :root { --ink:#0a0a0a; --body:#4b5563; --accent:#ff4b3e; --accent-text:#d1332a; --rule:#e5e7eb; --grid:#eef1f5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; background: #fff; font-family: "Fira Sans", Arial, sans-serif; color: var(--ink); }
  .frame {
    width: 1200px; height: var(--h, 630px); padding: 56px 64px; display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center;
    background-color: #fff;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px; position: relative;
  }
  .brand { position: absolute; left: 64px; top: 44px; height: 44px; }
  h1 { font-family: Poppins, Arial, sans-serif; font-weight: 700; font-size: 56px; line-height: 1.12; letter-spacing: -0.03em; margin-top: 40px; }
  h1 span { color: var(--accent); }
  .sub { margin-top: 26px; font-size: 26px; line-height: 1.4; color: var(--body); max-width: 560px; }
  .card { background: #fff; border: 2px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 0 var(--ink); padding: 26px 30px; margin-top: 40px; }
  .wrap { display: grid; grid-template-columns: 1fr 22px 128px; column-gap: 12px; align-items: center; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: 0; }
  .row b { font-family: Poppins, Arial, sans-serif; font-weight: 600; font-size: 24px; display: block; }
  .row i { font-style: normal; font-size: 16px; color: #6b7280; }
  .num { font-family: Poppins, Arial, sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.04em; line-height: 1; }
  .bracket { align-self: stretch; margin: 16px 0; border: 2px solid var(--ink); border-left: 0; border-radius: 0 10px 10px 0; }
  .note { font-family: Poppins, Arial, sans-serif; font-weight: 600; font-size: 21px; line-height: 1.25; letter-spacing: -0.01em; }
  .tag { margin-top: 18px; font-size: 15px; color: #6b7280; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <img class="brand" src="../public/closed-logic-logo.svg" alt="Closed Logic">
  <div>
    <h1>Your pipeline numbers don’t agree. <span>We find out which one is right.</span></h1>
    <p class="sub">Independent pipeline measurement for B2B SaaS.</p>
  </div>
  <div class="card">
    <div class="wrap">
      <div>
        <div class="row"><span><b>Google Ads</b><i>conversions</i></span><span class="num">42</span></div>
        <div class="row"><span><b>HubSpot</b><i>leads</i></span><span class="num">31</span></div>
        <div class="row"><span><b>Board deck</b><i>opportunities</i></span><span class="num">18</span></div>
      </div>
      <span class="bracket"></span>
      <p class="note">One number is wrong. We find out which.</p>
    </div>
    <p class="tag">Illustrative numbers, not a client result</p>
  </div>
</div>
</body>
</html>
