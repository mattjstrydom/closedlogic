<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Closed Logic share image</title>
<!-- Rendered to public/closedlogic-og-v6-1200x630.png and -x-1200x600.png by scripts/make-og.mjs.
     Brand mark and wordmark as in the site header (ring and brand dot, live Inter text), the site's self-hosted Inter, the site's
     colour tokens (app/globals.css :root). One headline, one line of support and one illustrative product panel (a lead moving from a
     website form through a CRM to an ad platform, one link not sent). The panel is labelled illustrative.
     Keep the alt text in app/seo.ts in step with the headline. -->
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal; src: url("../app/fonts/inter-latin-var.woff2") format("woff2"); }
  :root { --fg:#0b0b0c; --fg-muted:#5b616e; --border:#e7e8ec; --bg-subtle:#f6f7f9; --brand:#ff4b3e; --glow:#ffe3df;
          --good:#0e7490; --good-bg:#e3f4f8; --bad:#c8261b; --bad-bg:#fdecea; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; background: #fff; font-family: "Inter", Arial, sans-serif; font-optical-sizing: auto; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .frame {
    width: 1200px; height: var(--h, 630px); padding: 0 72px; display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center; position: relative; overflow: hidden;
    background: radial-gradient(620px 340px at 86% 84%, var(--glow), transparent 70%), #fff;
  }
  .brand { position: absolute; left: 72px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .brand svg { width: 40px; height: 40px; }
  .brand b { font-weight: 700; } .brand span { font-weight: 400; }
  h1 { font-weight: 600; font-size: 70px; line-height: 1.06; letter-spacing: -0.032em; text-wrap: balance; margin-top: 36px; }
  .sub { font-size: 26px; line-height: 1.4; color: var(--fg-muted); margin-top: 24px; max-width: 560px; letter-spacing: -0.01em; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 28px 8px; box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 24px 60px -20px rgba(16,24,40,.25); margin-top: 36px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; border-bottom: 1px solid var(--border); font-size: 25px; font-weight: 600; letter-spacing: -0.02em; }
  .row:last-of-type { border-bottom: 0; }
  .row small { display: block; font-size: 16px; font-weight: 400; color: var(--fg-muted); margin-top: 4px; letter-spacing: 0; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .good { background: var(--good-bg); color: var(--good); } .bad { background: var(--bad-bg); color: var(--bad); }
  .note { text-align: center; font-size: 15px; color: var(--fg-muted); margin-top: 14px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#0b0b0c" stroke-width="9" stroke-dasharray="104 34" stroke-dashoffset="-10" transform="rotate(-20 32 32)"/><circle cx="53" cy="32" r="7" fill="#ff4b3e" stroke="#0b0b0c" stroke-width="3"/></svg>
    <div><b>Closed</b> <span>Logic</span></div>
  </div>
  <div>
    <h1>Fractional marketing ops for B2B teams.</h1>
    <p class="sub">Fixed-scope jobs and monthly plans, at published prices.</p>
  </div>
  <div>
    <div class="panel">
      <div class="row"><div>Website form<small>Lead submitted</small></div><span class="pill good">Healthy</span></div>
      <div class="row"><div>CRM<small>Stage set by sales</small></div><span class="pill good">Healthy</span></div>
      <div class="row"><div>Ad platform<small>Qualified stage</small></div><span class="pill bad">Not sent</span></div>
    </div>
    <p class="note">Illustrative example</p>
  </div>
</div>
</body>
</html>
